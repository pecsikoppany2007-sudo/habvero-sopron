# HabVero: Netlify (a repo gyökere; a kész oldal a site/ mappa, build nincs)
[build]
  publish = "site"
  command = ""

# Demó: ne indexelje a kereső. ÉLESÍTÉSKOR törölni (és src/build.py: NOINDEX = False).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Az eszközök URL-je ?v=N számot visel, ezért hosszan cache-elhetők
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Nyelvenkénti 404
[[redirects]]
  from = "/de/*"
  to = "/de/404.html"
  status = 404
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404
